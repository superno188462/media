[project]
name = "feishu"
version = "0.1.0"
description = "内卷树懒飞书适配器：发送审核卡片、验证卡片动作来源、归一化为可信审核人上下文"
requires-python = ">=3.12"
dependencies = [
    "lark-oapi>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feishu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
