[project]
name = "content"
version = "0.1.0"
description = "内卷树懒内容生产流水线：选题 → 文案 → 配图 → 组稿 → 校验 → 人工审核 → 发布"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
