[project]
name = "approval"
version = "0.1.0"
description = "内卷树懒审核与发布任务状态机：草稿版本、送审、可信决定、唯一发布任务"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/approval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
